apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-eo-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # TODO: replace with your registry path after pushing.
          # Build:  docker build -t <registry>/state-ai-eo-frontend:latest ./frontend
          # Push:   docker push <registry>/state-ai-eo-frontend:latest
          image: your-registry/state-ai-eo-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
