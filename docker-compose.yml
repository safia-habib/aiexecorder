version: '3.9'

# ── Local development stack ─────────────────────────────────────────────────
# Usage:
#   1. Copy backend/.env.example to backend/.env and fill in Azure OpenAI creds
#   2. docker compose up -d
#   3. Run ingestion once:
#        docker exec -it ai-eo-backend \
#          python -m ingestion.ingest --data-path /data/State_AI_Executive_Orders_Dynatrace_Report.xlsx --recreate
#   4. Open http://localhost:3000
# ────────────────────────────────────────────────────────────────────────────

services:
  qdrant:
    container_name: ai-eo-qdrant
    image: qdrant/qdrant:v1.9.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    container_name: ai-eo-backend
    build:
      context: .                   # repo root — Dockerfile COPYs data/ into the image
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: state_eo
      # Azure OpenAI — override here or set in backend/.env
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      OTLP_ENDPOINT: ""
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    container_name: ai-eo-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
