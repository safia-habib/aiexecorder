apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-eo-explorer
data:
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "state_eo"

  # Azure OpenAI — non-secret config (API key is in app-secrets)
  AZURE_OPENAI_ENDPOINT: ""      # e.g. https://<resource>.openai.azure.com/
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"

  # OpenTelemetry / OpenInference — leave empty to disable tracing.
  OTLP_ENDPOINT: ""
  # Comma-separated key=value pairs.
  # Dynatrace:     Authorization=Api-Token dt0c01.XXXXXXXXXXXX
  # Arize Phoenix: api_key=<key>,space_id=<id>
  OTLP_HEADERS: ""
  OTLP_SERVICE_NAME: "state-ai-eo-explorer"
