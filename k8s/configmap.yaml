apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-eo-explorer
data:
  OLLAMA_URL: "http://ollama:11434"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "state_eo"
  EMBED_MODEL: "nomic-embed-text"
  LLM_MODEL: "llama3.1:8b"
  # Leave empty to disable OTel export. Set to your DT OTLP endpoint to enable tracing.
  OTLP_ENDPOINT: ""
